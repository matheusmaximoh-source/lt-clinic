<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fbf1ee;--card:#fff;--rose:#c9897b;--rose2:#b76e79;--deep:#8a4b57;--soft:#f6e4de;--line:#ecd5ce;--txt:#4a3236;--mut:#9a7a7e;--ok:#6f9f7f;--warn:#d89a5b;--bad:#c0525f;--gold:linear-gradient(135deg,#d9a592,#b9776a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;margin:0;color:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
#app{min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(251,241,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.mono{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;letter-spacing:-1px}
.brand{white-space:nowrap}.brand b{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--deep);line-height:1}
.brand small{font-size:9.5px;letter-spacing:.22em;color:var(--mut)}
#sync{margin-left:auto;white-space:nowrap;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
#sync.ok i{background:var(--ok)}#sync.err i{background:var(--bad)}
main{padding:16px;max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.04em}
nav button span{font-size:20px}nav button.on{color:var(--rose2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(183,110,121,.06)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile small{color:var(--mut);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tile b{display:block;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--deep);margin-top:2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:24px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--gold);color:#fff;font-weight:600;cursor:pointer}
.btn.sec2{background:var(--soft);color:var(--deep)}.btn.sm{padding:6px 12px;font-size:12.5px}.btn.bad{background:#f9e0e3;color:var(--bad)}
.btn.wa{background:#e3f3e8;color:#2f7a4a}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.ap{display:flex;gap:12px;align-items:flex-start}
.ap .t{min-width:54px;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--rose2);line-height:1}
.ap .t small{display:block;font-family:Montserrat;font-weight:400;font-size:10px;color:var(--mut)}
.ap .i{flex:1;min-width:0}.ap .i b{display:block}.ap .i span{color:var(--mut);font-size:13px}
.ap.done .i b{text-decoration:line-through;opacity:.5}
.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--deep);margin-right:4px;font-weight:600}
.chip.confirmado{background:#e3f3e8;color:#2f7a4a}.chip.concluido{background:#e6e9f7;color:#4a5496}.chip.cancelado,.chip.faltou{background:#f9e0e3;color:var(--bad)}.chip.pago{background:#e3f3e8;color:#2f7a4a}.chip.pend{background:#fbeedc;color:#a8691f}
.bx{width:26px;height:26px;accent-color:var(--rose2);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.wd{flex:1;min-width:46px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 0;cursor:pointer}
.wd small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}.wd b{font-size:17px}
.wd.on{background:var(--gold);color:#fff;border-color:transparent}.wd.on small{color:#fff}
.wd i{display:block;height:5px;font-size:0}.wd i.d:after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rose)}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
label{display:block;font-size:11.5px;color:var(--mut);margin:10px 0 4px;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:rgba(74,50,54,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:700px){#modal{align-items:center}#sheet{border-radius:24px}}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gold)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
#lock{position:fixed;inset:0;z-index:100;background:var(--soft);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lock img{width:220px;border-radius:24px}
#lock input{max-width:200px;text-align:center;font-size:24px;letter-spacing:.4em}
#splash{position:fixed;inset:0;z-index:99;background:#f8e6df;display:grid;place-items:center;transition:opacity .5s}
#splash img{width:240px;border-radius:24px}
</style>

const SB_URL='https://mxhycusfkbvxadwsszyr.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14aHljdXNma2J2eGFkd3NzenlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxOTEzMzgsImV4cCI6MjA5ODc2NzMzOH0.Cf8zbd8C178S1iZelltxOJt1mZ4ybkKxH3G8Mc1GJvU';

/* ===== dados + sync ===== */
let C={items:{},pending:{}};
try{C=JSON.parse(localStorage.getItem('lt_cache')||'')||C}catch(e){}
const persist=()=>{try{localStorage.setItem('lt_cache',JSON.stringify(C))}catch(e){}};
const list=t=>Object.entries(C.items).filter(([k,v])=>v.tipo===t).map(([k,v])=>({id:k,...v.dados}));
const get=id=>C.items[id]?{id,...C.items[id].dados}:null;
const CFG_ID='config_main';
const cfg=()=>Object.assign({clinica:'Larissa Tiemi Clinic',msgConf:'Olá, {nome}! Tudo bem? Passando para confirmar seu horário de {servico} dia {data} às {hora} na Larissa Tiemi Clinic. Posso confirmar? 💗',msgLemb:'Oi, {nome}! Lembrete do seu atendimento ({servico}) amanhã, {data} às {hora}, na Larissa Tiemi Clinic. Te esperamos! 💗'},get(CFG_ID)||{});
let _sb;const sb=()=>_sb||(_sb=supabase.createClient(SB_URL,SB_KEY));
function setSync(s,t){const e=$('sync');e.className=s;e.lastElementChild.textContent=t}
function save(tipo,id,dados){C.items[id]={tipo,dados:{...dados}};C.pending[id]='up';persist();flush();render()}
function del(id){delete C.items[id];C.pending[id]='del';persist();flush();render()}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{
    for(const [id,op] of Object.entries({...C.pending})){
      let r;
      if(op==='del')r=await sb().from('lt_dados').delete().eq('id',id);
      else{const it=C.items[id];if(!it){delete C.pending[id];continue}
        r=await sb().from('lt_dados').upsert({id,tipo:it.tipo,dados:it.dados,updated_at:new Date().toISOString()},{onConflict:'id'})}
      if(r.error)throw r.error;
      if(C.pending[id]===op)delete C.pending[id];
    }
    persist();setSync('ok','Sincronizado');
  }catch(e){console.log(e);setSync('err','Offline')}
  flushing=false;
}
async function pull(){
  if(Object.keys(C.pending).length){await flush()}
  try{
    const r=await sb().from('lt_dados').select('id,tipo,dados');
    if(r.error)throw r.error; // erro de leitura NUNCA apaga nada
    const remote={};r.data.forEach(x=>remote[x.id]=x);
    Object.keys(C.items).forEach(id=>{if(!remote[id]&&C.pending[id]!=='up')delete C.items[id]});
    r.data.forEach(x=>{if(!C.pending[x.id])C.items[x.id]={tipo:x.tipo,dados:x.dados}});
    persist();setSync('ok','Sincronizado');
    if(!$('modal').classList.contains('open'))render();
  }catch(e){console.log(e);setSync('err','Offline')}
}

const ativos=()=>list('atend').filter(a=>a.status!=='cancelado'&&a.status!=='faltou');

  $('main').innerHTML=({inicio:vInicio,agenda:vAgenda,clientes:vClientes,caixa:vCaixa,ajustes:vAjustes})[PAGE]();
}
function apCard(a,showDate){
  const c=get(a.clienteId)||{nome:'(cliente removido)'};
  const feito=a.status==='concluido'||a.pago;
  return `<div class="card ap ${a.pago?'done':''}"><div class="t" onclick="editAp('${a.id}')">${a.hora}<small>${showDate?fmtD(a.data).slice(0,5):a.duracao+' min'}</small></div>

  <div style="text-align:center"><input type="checkbox" class="bx" ${a.pago?'checked':''} onchange="togglePago('${a.id}')"><small style="display:block;font-size:9.5px;color:var(--mut)">recebi</small></div></div>`;
}
function togglePago(id){const a=get(id);delete a.id;a.pago=!a.pago;if(a.pago){a.pagoEm=TODAY();a.forma=a.forma||'Pix';if(a.status==='agendado'||a.status==='confirmado')a.status='concluido'}else{delete a.pagoEm}save('atend',id,a)}

/* ===== INÍCIO ===== */
function vInicio(){
  const hoje=ativos().filter(a=>a.data===TODAY()).sort(byTime),am=ativos().filter(a=>a.data===addD(TODAY(),1)).sort(byTime);
  const pend=ativos().filter(a=>!a.pago&&a.data<TODAY()).sort(byTime);
  const mes=TODAY().slice(0,7),rec=list('atend').filter(a=>a.pago&&(a.pagoEm||a.data).startsWith(mes)).reduce((s,a)=>s+(+a.valor||0),0);
  const aRec=hoje.filter(a=>!a.pago).reduce((s,a)=>s+(+a.valor||0),0);
  const wk=[...Array(7)].map((_,i)=>addD(TODAY(),i).slice(5));
  const aniv=list('clientes').filter(c=>c.nasc&&wk.includes(c.nasc.slice(5)));
  const h=new Date().getHours(),sau=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  return `<h1 style="font-size:32px">${sau}, Larissa 💗</h1><div style="color:var(--mut);margin:2px 0 14px">${DOW[new Date().getDay()]}, ${fmtD(TODAY())}</div>
  <div class="tiles"><div class="tile"><small>Hoje</small><b>${hoje.length} atend.</b></div><div class="tile"><small>A receber hoje</small><b>${BRL(aRec)}</b></div><div class="tile"><small>Recebido no mês</small><b>${BRL(rec)}</b></div></div>
  <div class="sec"><h2>Hoje</h2><button class="btn sm" onclick="editAp()">+ Agendar</button></div>
  ${hoje.map(a=>apCard(a)+'').join('')||'<div class="card empty">Nenhum atendimento hoje. Dia de descanso 🌷</div>'}
  <div class="sec"><h2>Lembretes de amanhã</h2></div>
  ${am.map(a=>{const c=get(a.clienteId)||{};return `<div class="card"><div class="row"><div class="sp"><b>${a.hora} · ${esc(c.nome)}</b><div style="color:var(--mut);font-size:13px">${esc(a.servico)} · <span class="chip ${a.status}">${STATUS[a.status]}</span></div></div>
   <button class="btn wa sm" onclick="lembrar('${a.id}')">💬 Lembrar</button></div></div>`}).join('')||'<div class="card empty">Nada marcado para amanhã.</div>'}
  ${pend.length?`<div class="sec"><h2>Pendentes de recebimento</h2></div>`+pend.map(a=>apCard(a,1)).join(''):''}
  ${aniv.length?`<div class="sec"><h2>Aniversariantes da semana 🎂</h2></div><div class="card">${aniv.map(c=>`<div class="li"><b class="sp">${esc(c.nome)}</b><span>${c.nasc.slice(8)}/${c.nasc.slice(5,7)}</span><button class="btn wa sm" onclick="zap('${esc(c.tel)}','Parabéns, ${esc(c.nome.split(' ')[0])}! 🎉 Muita saúde e beleza! Com carinho, Larissa Tiemi Clinic 💗')">💬</button></div>`).join('')}</div>`:''}`;
}
function lembrar(id){const a=get(id);zap((get(a.clienteId)||{}).tel,fillMsg(cfg().msgLemb,a))}
function confirmar(id){const a=get(id);zap((get(a.clienteId)||{}).tel,fillMsg(cfg().msgConf,a))}

/* ===== AGENDA ===== */
function vAgenda(){
  const ini=addD(DAY,-new Date(DAY+'T12:00:00').getDay()),all=ativos();
  const dias=[...Array(7)].map((_,i)=>addD(ini,i));
  const ds=list('atend').filter(a=>a.data===DAY).sort(byTime);
  return `<div class="row" style="margin-bottom:10px"><button class="btn sec2 sm" onclick="DAY=addD(DAY,-7);render()">‹ sem.</button><input type="date" value="${DAY}" onchange="DAY=this.value||TODAY();render()" style="flex:1"><button class="btn sec2 sm" onclick="DAY=addD(DAY,7);render()">sem. ›</button></div>
  <div class="week">${dias.map(d=>`<div class="wd ${d===DAY?'on':''}" onclick="DAY='${d}';render()"><small>${DOW[new Date(d+'T12:00:00').getDay()]}</small><b>${d.slice(8)}</b><i class="${all.some(a=>a.data===d)?'d':''}">.</i></div>`).join('')}</div>
  <div class="sec"><h2>${fmtD(DAY)}</h2><button class="btn sm" onclick="editAp()">+ Agendar</button></div>
  ${ds.map(a=>apCard(a)).join('')||'<div class="card empty">Dia livre. Toque em “+ Agendar”.</div>'}`;
}
function editAp(id){
  const a=id?get(id):{data:DAY,hora:'09:00',duracao:60,status:'agendado',pago:false,forma:'Pix',valor:''};
  const cl=list('clientes').sort((x,y)=>x.nome.localeCompare(y.nome)),sv=list('servicos').sort((x,y)=>x.nome.localeCompare(y.nome));
  $('sheet').innerHTML=`<h2 style="font-size:28px">${id?'Atendimento':'Novo agendamento'}</h2>
  <label>Cliente (digite para buscar as cadastradas)</label><input id="a-cli" list="dl-cli" autocomplete="off" placeholder="Nome da cliente" value="${esc((get(a.clienteId)||{}).nome||'')}" oninput="cliHint()">
  <datalist id="dl-cli">${cl.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist>
  <div id="a-novo" style="display:none"><div style="font-size:12.5px;color:var(--rose2);margin:6px 0 0">✨ Cliente nova — será cadastrada automaticamente ao salvar.</div><label>WhatsApp (com DDD)</label><input id="a-nt" inputmode="tel"></div>
  <label>Serviço</label><select id="a-sv" onchange="pickSv()"><option value="">— escolha —</option>${sv.map(s=>`<option value="${esc(s.nome)}" data-d="${s.dur}" ${s.nome===a.servico?'selected':''}>${esc(s.nome)}</option>`).join('')}</select>
  <div class="g2"><div><label>Data</label><input type="date" id="a-dt" value="${a.data}"></div><div><label>Hora</label><input type="time" id="a-hr" value="${a.hora}"></div></div>
  <div class="g2"><div><label>Duração (min)</label><input type="number" id="a-du" value="${a.duracao}" inputmode="numeric" oninput="this.dataset.touched=1"></div><div><label>Valor combinado (R$) *</label><input type="number" id="a-vl" value="${a.valor}" inputmode="decimal" step="0.01" placeholder="digite o valor"></div></div>
  <div class="g2"><div><label>Situação</label><select id="a-st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div><label>Forma de pagamento</label><select id="a-fp">${FORMAS.map(f=>`<option ${a.forma===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
  <label class="row" style="font-size:14px;color:var(--txt)"><input type="checkbox" id="a-pg" class="bx" style="width:26px" ${a.pago?'checked':''}> Pagamento recebido</label>
  <label>Observações</label><textarea id="a-ob" rows="2">${esc(a.obs||'')}</textarea>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveAp('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>
  ${id?`<button class="btn wa" onclick="confirmar('${id}')">💬 Confirmar</button><button class="btn bad" onclick="if(confirm('Excluir este atendimento?')){del('${id}');closeM()}">Excluir</button>`:''}</div>`;
  $('modal').classList.add('open');
}
function pickSv(){const o=$('a-sv').selectedOptions[0];if(o&&o.dataset.d&&!$('a-du').dataset.touched)$('a-du').value=o.dataset.d}
const findCli=n=>list('clientes').find(c=>c.nome.trim().toLowerCase()===String(n).trim().toLowerCase());
function cliHint(){const v=$('a-cli').value.trim();$('a-novo').style.display=v&&!findCli(v)?'block':'none'}
function saveAp(id){
  const nome=$('a-cli').value.trim();if(!nome){alert('Digite o nome da cliente.');return}
  if($('a-vl').value===''){alert('Digite o valor do atendimento.');$('a-vl').focus();return}
  const dt=$('a-dt').value,hr=$('a-hr').value||'09:00',du=+$('a-du').value||60;
  const ini=h=>{const [x,y]=h.split(':');return +x*60+ +y};
  const choque=ativos().find(o=>o.id!==id&&o.data===dt&&ini(hr)<ini(o.hora)+o.duracao&&ini(o.hora)<ini(hr)+du);
  if(choque&&!confirm('Já existe atendimento às '+choque.hora+' ('+((get(choque.clienteId)||{}).nome||'')+') que coincide com esse horário. Salvar mesmo assim?'))return;
  let ex=findCli(nome),cid=ex?ex.id:rid('cli');
  if(!ex)save('clientes',cid,{nome,tel:($('a-nt').value||'').trim(),nasc:'',obs:''});
  const old=id?get(id):{};delete old.id;
  const pago=$('a-pg').checked;
  const d={...old,clienteId:cid,servico:$('a-sv').value,data:$('a-dt').value,hora:$('a-hr').value||'09:00',duracao:+$('a-du').value||60,valor:+$('a-vl').value||0,status:$('a-st').value,forma:$('a-fp').value,pago,obs:$('a-ob').value.trim()};
  if(pago&&!old.pago)d.pagoEm=TODAY();if(!pago)delete d.pagoEm;
  if(!d.data){alert('Escolha a data.');return}
  save('atend',id||rid('atd'),d);DAY=d.data;closeM();
}
function closeM(){$('modal').classList.remove('open')}

/* ===== CLIENTES ===== */
function vClientes(){
  const q=BUSCA.toLowerCase(),cl=list('clientes').filter(c=>c.nome.toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="sec" style="margin-top:0"><h2>Clientes</h2><button class="btn sm" onclick="editCli()">+ Nova</button></div>
  <input placeholder="Buscar cliente…" value="${esc(BUSCA)}" oninput="BUSCA=this.value;rerenderList(this)" style="margin-bottom:12px">
  <div id="cl-list">${cliList(cl)}</div>`;
}
function cliList(cl){return cl.map(c=>{const n=list('atend').filter(a=>a.clienteId===c.id).length;return `<div class="card row" onclick="editCli('${c.id}')"><div class="mono" style="width:38px;height:38px;font-size:16px">${esc(c.nome[0]||'?').toUpperCase()}</div><div class="sp"><b>${esc(c.nome)}</b><div style="color:var(--mut);font-size:12.5px">${esc(c.tel||'sem telefone')} · ${n} atend.</div></div></div>`}).join('')||'<div class="empty">Nenhuma cliente encontrada.</div>'}
function rerenderList(el){const q=BUSCA.toLowerCase();$('cl-list').innerHTML=cliList(list('clientes').filter(c=>c.nome.toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome)))}
function editCli(id){
  const c=id?get(id):{nome:'',tel:'',nasc:'',obs:''},h=id?list('atend').filter(a=>a.clienteId===id).sort((a,b)=>byTime(b,a)):[];
  $('sheet').innerHTML=`<h2 style="font-size:28px">${id?'Cliente':'Nova cliente'}</h2>
  <label>Nome</label><input id="c-n" value="${esc(c.nome)}"><div class="g2"><div><label>WhatsApp (DDD)</label><input id="c-t" inputmode="tel" value="${esc(c.tel)}"></div><div><label>Aniversário</label><input type="date" id="c-b" value="${c.nasc||''}"></div></div>
  <label>Anotações (alergias, queixas, preferências, anamnese)</label><textarea id="c-o" rows="4">${esc(c.obs)}</textarea>
  <div class="acts" style="margin:16px 0"><button class="btn" onclick="saveCli('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>
  ${id?`<button class="btn wa" onclick="zap('${esc(c.tel)}','Olá, ${esc(c.nome.split(' ')[0])}! 💗')">💬 WhatsApp</button><button class="btn sec2" onclick="closeM();DAY=TODAY();editApCli('${id}')">Agendar</button>`:''}</div>
  ${id?`<h3 style="font-size:22px">Histórico</h3>${h.map(a=>`<div class="li"><span>${fmtD(a.data)}</span><b class="sp">${esc(a.servico)}</b><span class="chip ${a.pago?'pago':'pend'}">${BRL(a.valor)}</span></div>`).join('')||'<div class="empty">Sem atendimentos ainda.</div>'}
  <div class="acts" style="margin-top:14px"><button class="btn bad sm" onclick="if(confirm('Excluir esta cliente? Os atendimentos dela continuam registrados.')){del('${id}');closeM()}">Excluir cliente</button></div>`:''}`;
  $('modal').classList.add('open');
}
function editApCli(cid){editAp();$('a-cli').value=(get(cid)||{}).nome||''}
function saveCli(id){const n=$('c-n').value.trim();if(!n){alert('Digite o nome.');return}save('clientes',id||rid('cli'),{nome:n,tel:$('c-t').value.trim(),nasc:$('c-b').value,obs:$('c-o').value.trim()});closeM()}

/* ===== CAIXA ===== */
function vCaixa(){
  const at=list('atend').filter(a=>a.status!=='cancelado'&&a.status!=='faltou');
  const recM=at.filter(a=>a.pago&&(a.pagoEm||a.data).startsWith(MONTH)),rec=recM.reduce((s,a)=>s+(+a.valor||0),0);
  const prev=at.filter(a=>!a.pago&&a.data.startsWith(MONTH)).reduce((s,a)=>s+(+a.valor||0),0);
  const dp=list('despesas').filter(d=>d.data.startsWith(MONTH)).sort((a,b)=>b.data.localeCompare(a.data));
  const desp=dp.filter(d=>d.pago).reduce((s,d)=>s+(+d.valor||0),0),dpend=dp.filter(d=>!d.pago).reduce((s,d)=>s+(+d.valor||0),0);
  const por={},fm={};recM.forEach(a=>{por[a.servico||'Outros']=(por[a.servico||'Outros']||0)+(+a.valor||0);fm[a.forma||'Outro']=(fm[a.forma||'Outro']||0)+(+a.valor||0)});
  const mx=Math.max(1,...Object.values(por));
  return `<div class="row" style="margin-bottom:12px"><button class="btn sec2 sm" onclick="MONTH=addM(-1);render()">‹</button><input type="month" value="${MONTH}" onchange="MONTH=this.value||TODAY().slice(0,7);render()" style="flex:1"><button class="btn sec2 sm" onclick="MONTH=addM(1);render()">›</button></div>
  <div class="tiles"><div class="tile"><small>Recebido</small><b style="color:var(--ok)">${BRL(rec)}</b></div><div class="tile"><small>A receber</small><b style="color:var(--warn)">${BRL(prev)}</b></div><div class="tile"><small>Despesas pagas</small><b style="color:var(--bad)">${BRL(desp)}</b></div><div class="tile"><small>Lucro do mês</small><b>${BRL(rec-desp)}</b></div></div>
  <div class="card"><h3>Por serviço</h3>${Object.entries(por).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-top:8px;font-size:13px"><div class="row"><span class="sp">${esc(k)}</span><b>${BRL(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<div class="empty">Sem recebimentos neste mês.</div>'}
  ${Object.keys(fm).length?`<div style="margin-top:12px;font-size:12.5px;color:var(--mut)">`+Object.entries(fm).map(([k,v])=>`${k}: <b>${BRL(v)}</b>`).join(' · ')+`</div>`:''}</div>
  <div class="sec"><h2>Despesas</h2><button class="btn sm" onclick="editDesp()">+ Despesa</button></div>
  <div class="card">${dp.map(d=>`<div class="li ${d.pago?'ap done':''}"><input type="checkbox" class="bx" ${d.pago?'checked':''} onchange="togDesp('${d.id}')"><div class="sp" onclick="editDesp('${d.id}')"><div class="i"><b>${esc(d.nome)}</b></div><small style="color:var(--mut)">${fmtD(d.data)}</small></div><b>${BRL(d.valor)}</b></div>`).join('')||'<div class="empty">Nenhuma despesa neste mês.</div>'}
  ${dpend?`<div style="margin-top:8px;font-size:12.5px;color:var(--mut)">A pagar: <b>${BRL(dpend)}</b></div>`:''}</div>`;
}
function addM(n){const d=new Date(MONTH+'-15T12:00:00');d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)}
function togDesp(id){const d=get(id);delete d.id;d.pago=!d.pago;save('despesas',id,d)}
function editDesp(id){const d=id?get(id):{nome:'',valor:'',data:TODAY(),pago:false};
  $('sheet').innerHTML=`<h2 style="font-size:28px">Despesa</h2><label>Descrição</label><input id="d-n" value="${esc(d.nome)}" placeholder="Ex.: Óleo de massagem, aluguel da sala…">
  <div class="g2"><div><label>Valor</label><input id="d-v" type="number" step="0.01" inputmode="decimal" value="${d.valor}"></div><div><label>Data</label><input id="d-d" type="date" value="${d.data}"></div></div>
  <label class="row" style="font-size:14px;color:var(--txt)"><input type="checkbox" id="d-p" class="bx" style="width:26px" ${d.pago?'checked':''}> Já paguei</label>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveDesp('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>${id?`<button class="btn bad" onclick="del('${id}');closeM()">Excluir</button>`:''}</div>`;
  $('modal').classList.add('open')}
function saveDesp(id){const n=$('d-n').value.trim();if(!n){alert('Digite a descrição.');return}save('despesas',id||rid('dsp'),{nome:n,valor:+$('d-v').value||0,data:$('d-d').value||TODAY(),pago:$('d-p').checked});closeM()}

/* ===== AJUSTES ===== */
function vAjustes(){
  const c=cfg(),sv=list('servicos').sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="sec" style="margin-top:0"><h2>Serviços</h2><button class="btn sm" onclick="editSv()">+ Serviço</button></div>
  <div class="card">${sv.map(s=>`<div class="li" onclick="editSv('${s.id}')"><b class="sp">${esc(s.nome)}</b><span style="color:var(--mut)">${s.dur} min</span></div>`).join('')||'<div class="empty">Cadastre seus serviços (só o nome e a duração).</div>'}</div>
  <div class="sec"><h2>Mensagens do WhatsApp</h2></div><div class="card">
  <label>Confirmação</label><textarea id="s-mc" rows="3">${esc(c.msgConf)}</textarea><label>Lembrete (véspera)</label><textarea id="s-ml" rows="3">${esc(c.msgLemb)}</textarea>
  <div style="font-size:11.5px;color:var(--mut);margin-top:6px">Use {nome} {servico} {data} {hora}</div><div class="acts" style="margin-top:10px"><button class="btn sm" onclick="saveMsgs()">Salvar mensagens</button></div></div>
  <div class="sec"><h2>Segurança e backup</h2></div><div class="card"><div class="acts" style="margin:0">
  <button class="btn sec2 sm" onclick="setPin()">🔒 ${localStorage.getItem('lt_pin')?'Trocar / remover':'Criar'} PIN deste aparelho</button><button class="btn sec2 sm" onclick="backup()">⬇️ Baixar backup</button><button class="btn sec2 sm" onclick="pull()">🔄 Sincronizar agora</button></div></div>`;
}
function saveMsgs(){const c=get(CFG_ID)||{};delete c.id;save('config',CFG_ID,{...c,msgConf:$('s-mc').value,msgLemb:$('s-ml').value});alert('Salvo!')}
function editSv(id){const s=id?get(id):{nome:'',preco:'',dur:60};
  $('sheet').innerHTML=`<h2 style="font-size:28px">Serviço</h2><label>Nome</label><input id="s-n" value="${esc(s.nome)}"><label>Duração padrão (min)</label><input id="s-d" type="number" inputmode="numeric" value="${s.dur}"><div style="font-size:11.5px;color:var(--mut);margin-top:6px">O valor é digitado a cada atendimento.</div>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveSv('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>${id?`<button class="btn bad" onclick="del('${id}');closeM()">Excluir</button>`:''}</div>`;$('modal').classList.add('open')}
function saveSv(id){const n=$('s-n').value.trim();if(!n)return;save('servicos',id||rid('svc'),{nome:n,dur:+$('s-d').value||60});closeM()}
function setPin(){const p=prompt(localStorage.getItem('lt_pin')?'Novo PIN (4 a 8 números). Deixe vazio para remover:':'Crie um PIN (4 a 8 números):');if(p===null)return;
  if(!p){localStorage.removeItem('lt_pin');alert('PIN removido.');render();return}if(!/^\d{4,8}$/.test(p)){alert('Use de 4 a 8 números.');return}localStorage.setItem('lt_pin',p);alert('PIN criado neste aparelho.');render()}
function chkPin(){if($('pin').value===localStorage.getItem('lt_pin')){$('lock').style.display='none';$('pin').value=''}}
function backup(){const b=new Blob([JSON.stringify(C.items,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lt-clinic-backup-'+TODAY()+'.json';a.click()}

/* ===== início ===== */
if(localStorage.getItem('lt_pin'))$('lock').style.display='flex';
render();
setTimeout(()=>{$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),500)},1100);
(async()=>{await pull();
  // primeira vez: cadastra serviços de exemplo (editáveis)
  if(!list('servicos').length&&!get(CFG_ID)&&$('sync').className==='ok'){
    [['Massagem relaxante',60],['Massagem modeladora',60],['Drenagem linfática',60],['Limpeza de pele',90],['Design de sobrancelha',40]].forEach(([n,d])=>save('servicos',rid('svc'),{nome:n,dur:d}));
    save('config',CFG_ID,{clinica:'Larissa Tiemi Clinic'});
  }})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!document.hidden)pull()},30000);
</script>
</body>
</html>
