<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fbf1ee;--card:#fff;--rose:#c9897b;--rose2:#b76e79;--deep:#8a4b57;--soft:#f6e4de;--line:#ecd5ce;--txt:#4a3236;--mut:#9a7a7e;--ok:#6f9f7f;--warn:#d89a5b;--bad:#c0525f;--gold:linear-gradient(135deg,#d9a592,#b9776a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;margin:0;color:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
#app{min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(251,241,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.mono{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;letter-spacing:-1px}
.brand{white-space:nowrap}.brand b{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--deep);line-height:1}
.brand small{font-size:9.5px;letter-spacing:.22em;color:var(--mut)}
#sync{margin-left:auto;white-space:nowrap;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.gear{border:0;background:none;font-size:20px;padding:4px;cursor:pointer}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
#sync.ok i{background:var(--ok)}#sync.err i{background:var(--bad)}
main{padding:16px;max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;padding:9px 0 8px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.04em}
nav button span{font-size:20px}nav button.on{color:var(--rose2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(183,110,121,.06)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile small{color:var(--mut);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tile b{display:block;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--deep);margin-top:2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:24px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--gold);color:#fff;font-weight:600;cursor:pointer}
.btn.sec2{background:var(--soft);color:var(--deep)}.btn.sm{padding:6px 12px;font-size:12.5px}.btn.bad{background:#f9e0e3;color:var(--bad)}
.btn.wa{background:#e3f3e8;color:#2f7a4a}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.ap{display:flex;gap:12px;align-items:flex-start}
.ap .t{min-width:54px;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--rose2);line-height:1}
.ap .t small{display:block;font-family:Montserrat;font-weight:400;font-size:10px;color:var(--mut)}
.ap .i{flex:1;min-width:0}.ap .i b{display:block}.ap .i span{color:var(--mut);font-size:13px}
.ap.done .i b{text-decoration:line-through;opacity:.5}
.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--deep);margin-right:4px;font-weight:600}
.chip.confirmado{background:#e3f3e8;color:#2f7a4a}.chip.concluido{background:#e6e9f7;color:#4a5496}.chip.cancelado,.chip.faltou{background:#f9e0e3;color:var(--bad)}.chip.pago{background:#e3f3e8;color:#2f7a4a}.chip.pend{background:#fbeedc;color:#a8691f}
.bx{width:26px;height:26px;accent-color:var(--rose2);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.wd{flex:1;min-width:46px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 0;cursor:pointer}
.wd small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}.wd b{font-size:17px}
.wd.on{background:var(--gold);color:#fff;border-color:transparent}.wd.on small{color:#fff}
.wd i{display:block;height:5px;font-size:0}.wd i.d:after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rose)}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
label{display:block;font-size:11.5px;color:var(--mut);margin:10px 0 4px;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:rgba(74,50,54,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:700px){#modal{align-items:center}#sheet{border-radius:24px}}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gold)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
#lock{position:fixed;inset:0;z-index:100;background:var(--soft);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lock img{width:220px;border-radius:24px}
#lock input{max-width:200px;text-align:center;font-size:24px;letter-spacing:.4em}
#splash{position:fixed;inset:0;z-index:99;background:#f8e6df;display:grid;place-items:center;transition:opacity .5s}

function setSync(s,t){const e=$('sync');e.className=s;e.lastElementChild.textContent=t}
function save(tipo,id,dados){C.items[id]={tipo,dados:{...dados}};C.pending[id]='up';persist();flush();render()}
function del(id){delete C.items[id];C.pending[id]='del';persist();flush();render()}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{
    for(const [id,op] of Object.entries({...C.pending})){
      let r;
      if(op==='del')r=await sb().from('lt_dados').delete().eq('id',id);
      else{const it=C.items[id];if(!it){delete C.pending[id];continue}
        r=await sb().from('lt_dados').upsert({id,tipo:it.tipo,dados:it.dados,updated_at:new Date().toISOString()},{onConflict:'id'})}
      if(r.error)throw r.error;
      if(C.pending[id]===op)delete C.pending[id];
    }
    persist();setSync('ok','Sincronizado');
  }catch(e){console.log(e);setSync('err','Offline')}
  flushing=false;
}
async function pull(){
  if(Object.keys(C.pending).length){await flush()}
  try{
    const r=await sb().from('lt_dados').select('id,tipo,dados');
    if(r.error)throw r.error; // erro de leitura NUNCA apaga nada
    const remote={};r.data.forEach(x=>remote[x.id]=x);
    Object.keys(C.items).forEach(id=>{if(!remote[id]&&C.pending[id]!=='up')delete C.items[id]});
    r.data.forEach(x=>{if(!C.pending[x.id])C.items[x.id]={tipo:x.tipo,dados:x.dados}});
    persist();setSync('ok','Sincronizado');
    if(!$('modal').classList.contains('open'))render();
  }catch(e){console.log(e);setSync('err','Offline')}
}

function vAgenda(){
  const ini=addD(DAY,-new Date(DAY+'T12:00:00').getDay()),all=ativos();
  const dias=[...Array(7)].map((_,i)=>addD(ini,i));
  const ds=list('atend').filter(a=>a.data===DAY).sort(byTime);
  return `<div class="row" style="margin-bottom:10px"><button class="btn sec2 sm" onclick="DAY=addD(DAY,-7);render()">‹ sem.</button><input type="date" value="${DAY}" onchange="DAY=this.value||TODAY();render()" style="flex:1"><button class="btn sec2 sm" onclick="DAY=addD(DAY,7);render()">sem. ›</button></div>
  <div class="week">${dias.map(d=>`<div class="wd ${d===DAY?'on':''}" onclick="DAY='${d}';render()"><small>${DOW[new Date(d+'T12:00:00').getDay()]}</small><b>${d.slice(8)}</b><i class="${all.some(a=>a.data===d)?'d':''}">.</i></div>`).join('')}</div>

function renderItens(){
  const sv=list('servicos'),c=findCli($('a-cli').value),pks=c?list('pacotes').filter(p=>p.clienteId===c.id):[];
  $('a-itens').innerHTML=AP_ITENS.map((it,i)=>{
    const op=pks.filter(p=>p.total-usadasEx(p,AP_ID)-AP_ITENS.filter((x,k)=>k!==i&&x.pacoteId===p.id).length>0||p.id===it.pacoteId);
    const s=sv.find(x=>x.nome===it.nome);
    return `<div class="card" style="padding:10px;margin-bottom:8px"><div class="row"><select class="sp" onchange="itSv(${i},this.value)"><option value="">— escolha o procedimento —</option>${CATS.map(([k,l])=>{const g=sv.filter(x=>(x.cat||'outros')===k).sort((a,b)=>a.nome.localeCompare(b.nome));return g.length?`<optgroup label="${l}">`+g.map(x=>`<option value="${esc(x.nome)}" ${x.nome===it.nome?'selected':''}>${esc(x.nome)}</option>`).join('')+'</optgroup>':''}).join('')}</select>${AP_ITENS.length>1?`<button type="button" class="rm" style="border:0;background:#f9e0e3;color:var(--bad);border-radius:10px;width:34px;height:38px" onclick="itDel(${i})">✕</button>`:''}</div>
    <div class="g2"><div><label>Valor (R$) *</label><input type="number" step="0.01" inputmode="decimal" placeholder="digite" value="${it.pacoteId?0:(it.valor??'')}" ${it.pacoteId?'disabled':''} oninput="itVl(${i},this.value)"></div>
    ${op.length?`<div><label>Pacote</label><select onchange="itPk(${i},this.value)"><option value="">Não — avulso</option>${op.map(p=>`<option value="${p.id}" ${p.id===it.pacoteId?'selected':''}>${esc(p.nome)} (restam ${p.total-usadasEx(p,AP_ID)-AP_ITENS.filter((x,k)=>k!==i&&x.pacoteId===p.id).length})</option>`).join('')}</select></div>`:'<div></div>'}</div>
    ${s&&s.preco&&!it.pacoteId?`<button type="button" class="btn sec2 sm" style="margin-top:6px" onclick="itVl(${i},${+s.preco},1)">Tabela: ${BRL(+s.preco)} — usar</button>`:''}</div>`}).join('');

function updTotal(){const tot=AP_ITENS.filter(i=>!i.pacoteId).reduce((s,i)=>s+(+i.valor||0),0);const e=$('a-total');if(e)e.textContent='Total do atendimento: '+BRL(tot)}
function durAuto(){const d=$('a-du');if(!d||d.dataset.touched)return;const sv=list('servicos'),m=AP_ITENS.reduce((s,i)=>s+((sv.find(x=>x.nome===i.nome)||{}).dur||0),0);if(m>0){d.value=m;confLive()}}
function itSv(i,v){AP_ITENS[i].nome=v;durAuto();renderItens()}
function itVl(i,v,re){AP_ITENS[i].valor=v===''?'':+v;if(re)renderItens();else updTotal()}
function itPk(i,v){AP_ITENS[i].pacoteId=v;if(v)AP_ITENS[i].valor=0;else AP_ITENS[i].valor='';renderItens()}
function itAdd(){AP_ITENS.push({nome:'',valor:'',pacoteId:''});renderItens()}
function itDel(i){AP_ITENS.splice(i,1);durAuto();renderItens()}
function refreshPk(){if($('a-itens')){AP_ITENS.forEach(it=>{if(it.pacoteId&&!list('pacotes').some(p=>p.id===it.pacoteId))it.pacoteId=''});renderItens()}}
function confLive(){const e=$('a-conf');if(!e)return;const st=$('a-st').value;e.innerHTML='';if(st==='cancelado'||st==='faltou')return;
  const dt=$('a-dt').value,hr=$('a-hr').value||'09:00',du=+$('a-du').value||60;if(!dt)return;
  const o=achaChoque(AP_ID,dt,hr,du);if(!o)return;const nx=proxLivre(AP_ID,dt,hr,du);
  e.innerHTML=`<div style="margin-top:8px;font-size:12.5px;color:var(--bad);background:#f9e0e3;border-radius:12px;padding:8px 12px">⛔ Horário ocupado: ${esc((get(o.clienteId)||{}).nome||'')} das ${o.hora} às ${fmtMin(toMin(o.hora)+(+o.duracao||60))}.${nx!==null&&nx+du<=1440?' Próximo horário livre: <b>'+fmtMin(nx)+'</b>.':''}</div>`}
function fpPick(){const f=$('a-fp').value;$('a-pcbox').style.visibility=f===CRED?'visible':'hidden';$('a-tnote').style.display=f===TROCA?'block':'none'}
const findCli=n=>list('clientes').find(c=>c.nome.trim().toLowerCase()===String(n).trim().toLowerCase());
function cliHint(){const v=$('a-cli').value.trim();$('a-novo').style.display=v&&!findCli(v)?'block':'none';renderItens()}
function saveAp(id){
  const nome=$('a-cli').value.trim();if(!nome){alert('Digite o nome da cliente.');return}
  const itens=AP_ITENS.filter(i=>i.nome);if(!itens.length){alert('Escolha ao menos um procedimento.');return}
  for(const it of itens)if(!it.pacoteId&&(it.valor===''||it.valor==null)){alert('Digite o valor de "'+it.nome+'".');return}
  const dt=$('a-dt').value,hr=$('a-hr').value||'09:00',du=+$('a-du').value||60,st=$('a-st').value;
  if(!dt){alert('Escolha a data.');return}
  if(st!=='cancelado'&&st!=='faltou'){const o=achaChoque(id,dt,hr,du);
    if(o){const nx=proxLivre(id,dt,hr,du);alert('⛔ Não é possível agendar: esse horário já está ocupado por '+((get(o.clienteId)||{}).nome||'outra cliente')+' ('+o.hora+' às '+fmtMin(toMin(o.hora)+(+o.duracao||60))+').'+(nx!==null&&nx+du<=1440?'\n\nPróximo horário livre: '+fmtMin(nx)+'.':''));return}}
  const ex=findCli(nome),cid=ex?ex.id:rid('cli');
  if(!ex)save('clientes',cid,{nome,tel:($('a-nt').value||'').trim(),nasc:'',obs:''});
  const old=id?get(id):{};delete old.id;delete old.pacoteId;
  const its=itens.map(i=>({nome:i.nome,valor:i.pacoteId?0:(+i.valor||0),...(i.pacoteId?{pacoteId:i.pacoteId}:{})})),todosPk=its.every(i=>i.pacoteId);
  const d={...old,clienteId:cid,servico:its.map(i=>i.nome).join(' + '),itens:its,data:dt,hora:hr,duracao:du,valor:its.reduce((s,i)=>s+i.valor,0),status:st,forma:todosPk?'Pacote':$('a-fp').value,pago:todosPk?true:$('a-pg').checked,obs:$('a-ob').value.trim()};
  d.sinal=+$('a-sn').value||0;d.parcelas=d.forma===CRED?(+$('a-pc').value||1):1;if(d.forma===TROCA)d.pago=true;
  if(d.pago&&!old.pago)d.pagoEm=TODAY();if(!d.pago)delete d.pagoEm;
  save('atend',id||rid('atd'),d);DAY=d.data;closeM();
}

function trocaBox(cid){const c=get(cid),s=saldoTroca(cid),ts=list('trocas').filter(x=>x.parceiraId===cid).sort((a,b)=>b.data.localeCompare(a.data));

function saveTroca(cid,id){const d=$('x-d').value.trim();if(!d||$('x-v').value===''){alert('Informe o serviço e o valor.');return}save('trocas',id||rid('trc'),{parceiraId:cid,desc:d,valor:+$('x-v').value||0,data:$('x-t').value||TODAY()});editCli(cid)}

/* ===== ESTOQUE ===== */
const PCATS=['Facial','Corporal','Sobrancelha','Descartáveis','Outros'];
const alertaDe=p=>p.alerta===undefined||p.alerta===''?3:+p.alerta;
const n1=v=>(+v).toLocaleString('pt-BR',{maximumFractionDigits:1});
function estProd(p){
  const ent=p.entradas||[],cap=ent.reduce((s,e)=>s+(+e.un||0)*(+p.rende||0),0),svs=list('servicos');
  let uso=0;
  list('atend').forEach(a=>{if(a.status!=='concluido'||a.data<(p.desde||'0000-00-00'))return;itensDe(a).forEach(i=>{const s=svs.find(x=>x.nome===i.nome);if(!s||!s.prods)return;const u=s.prods.find(x=>x.id===p.id);if(u)uso+=(+u.uso||1)})});
  const rest=cap-uso+(+p.ajuste||0),custo=ent.reduce((s,e)=>s+(+e.custo||0),0);
  return {cap,uso,rest,cps:cap?custo/cap:0,un:p.rende?rest/p.rende:0,capEf:Math.max(cap,rest,1)};
}
function prodsBox(s){const ps=list('produtos').sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!ps.length)return `<div style="font-size:12px;color:var(--mut);margin-top:10px">📦 Cadastre produtos na aba Estoque para ligar aos serviços e controlar o consumo.</div>`;
  const cm=(s.prods||[]).reduce((t,u)=>{const p=get(u.id);return t+(p?estProd(p).cps*(+u.uso||1):0)},0);
  return `<label style="margin-top:14px">Produtos usados em cada atendimento</label><div class="card" style="padding:8px 12px;margin-bottom:0">${ps.map(p=>{const u=(s.prods||[]).find(x=>x.id===p.id);return `<div class="li"><input type="checkbox" class="bx" id="sp-${p.id}" ${u?'checked':''}><span class="sp">${esc(p.nome)}</span><input id="su-${p.id}" type="number" step="0.1" value="${u?u.uso:1}" style="width:64px;padding:6px"><small style="color:var(--mut)">sessão</small></div>`}).join('')}</div>${cm?`<div style="font-size:12px;color:var(--mut);margin-top:6px">Custo de material estimado: <b>${BRL(cm)}</b> por atendimento.</div>`:''}`}
function vEstoque(){
  const ps=list('produtos').map(p=>({p,e:estProd(p)})).sort((a,b)=>(a.e.rest-alertaDe(a.p))-(b.e.rest-alertaDe(b.p)));
  const rp=ps.filter(x=>x.e.rest>0&&x.e.rest<=alertaDe(x.p)).length,zr=ps.filter(x=>x.e.rest<=0).length;
  return `<div class="sec" style="margin-top:0"><h2>Estoque</h2><button class="btn sm" onclick="editProd()">+ Produto</button></div>
  <div class="tiles"><div class="tile"><small>Produtos</small><b>${ps.length}</b></div><div class="tile"><small>Para repor</small><b style="color:var(--warn)">${rp}</b></div><div class="tile"><small>Esgotados</small><b style="color:var(--bad)">${zr}</b></div></div>
  <div style="color:var(--mut);font-size:12.5px;margin:0 2px 10px">O consumo desconta sozinho a cada atendimento <b>concluído</b>, de acordo com os produtos ligados ao serviço (Catálogo → serviço).</div>
  ${ps.map(({p,e})=>{const al=alertaDe(p),st=e.rest<=0?['cancelado','Esgotado']:e.rest<=al?['pend','Repor']:['pago','OK'];
   return `<div class="card" onclick="editProd('${p.id}')"><div class="row"><div class="sp"><b>${esc(p.nome)}</b><div style="color:var(--mut);font-size:12px">${esc(p.cat||'')}${p.unidade?' · '+esc(p.unidade):''}</div></div><span class="chip ${st[0]}">${st[1]}</span></div>
   <div class="row" style="margin-top:8px;align-items:baseline"><b style="font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--deep)">${n1(Math.max(0,e.rest))}</b><span style="color:var(--mut)">sessões restantes · ≈ ${n1(Math.max(0,e.un))} un.</span></div>
   <div class="bar"><i style="width:${Math.max(0,Math.min(100,e.rest/e.capEf*100))}%"></i></div>
   <div style="color:var(--mut);font-size:11.5px;margin-top:6px">Avisa com ${al} ou menos${e.cps?' · custo ≈ '+BRL(e.cps)+'/sessão':''}</div></div>`}).join('')||'<div class="card empty">Nenhum produto ainda. Toque em “+ Produto” e informe quantas sessões cada embalagem rende.</div>'}`;
}
function editProd(id){
  const p=id?get(id):{nome:'',cat:'Facial',unidade:'',rende:'',alerta:3,obs:''},e=id?estProd(p):null;
  $('sheet').innerHTML=`<h2 style="font-size:28px">${id?'Produto':'Novo produto'}</h2>
  <label>Nome</label><input id="pr-n" value="${esc(p.nome)}" placeholder="Ex.: Creme de massagem, Máscara facial…">
  <div class="g2"><div><label>Categoria</label><select id="pr-c">${PCATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Embalagem</label><input id="pr-u" value="${esc(p.unidade||'')}" placeholder="frasco 500 ml"></div></div>
  <div class="g2"><div><label>Sessões que cada embalagem rende *</label><input id="pr-r" type="number" step="0.1" inputmode="decimal" value="${p.rende}"></div><div><label>Avisar quando restar (sessões)</label><input id="pr-a" type="number" inputmode="numeric" value="${alertaDe(p)}"></div></div>
  ${id?`<div class="card" style="margin-top:12px;font-size:13px">Restam <b>${n1(e.rest)} sessões</b> (≈ ${n1(e.un)} un.) · já usadas desde ${fmtD(p.desde)}: <b>${n1(e.uso)}</b>${e.cps?' · custo ≈ '+BRL(e.cps)+'/sessão':''}</div>
   <div class="acts"><button class="btn wa" onclick="compraProd('${id}')">🛒 Registrar compra</button><button class="btn sec2" onclick="ajustarProd('${id}')">✏️ Acertar contagem</button></div>`
  :`<div class="g2"><div><label>Unidades compradas *</label><input id="pr-q" type="number" step="0.1" inputmode="decimal" value="1"></div><div><label>Valor pago (R$)</label><input id="pr-v" type="number" step="0.01" inputmode="decimal" placeholder="opcional"></div></div>
   <label class="row" style="font-size:13.5px;color:var(--txt)"><input type="checkbox" id="pr-d" class="bx" style="width:26px" checked> Lançar a compra como despesa no Caixa</label>`}
  <label>Onde comprar / observações</label><textarea id="pr-o" rows="2">${esc(p.obs||'')}</textarea>
  ${id&&(p.entradas||[]).length?`<h3 style="font-size:20px;margin:12px 0 4px">Compras</h3>${p.entradas.slice().reverse().map(x=>`<div class="li"><span>${fmtD(x.data)}</span><b class="sp">${n1(x.un)} un.</b><span>${x.custo?BRL(x.custo):'—'}</span></div>`).join('')}`:''}
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveProd('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>${id?`<button class="btn bad" onclick="if(confirm('Excluir este produto?')){del('${id}');closeM()}">Excluir</button>`:''}</div>`;
  $('modal').classList.add('open')}
function saveProd(id){const n=$('pr-n').value.trim(),r=+$('pr-r').value;if(!n||!(r>0)){alert('Informe o nome e quantas sessões cada embalagem rende.');return}
  const base={nome:n,cat:$('pr-c').value,unidade:$('pr-u').value.trim(),rende:r,alerta:+$('pr-a').value,obs:$('pr-o').value.trim()};
  if(id){const o=get(id);delete o.id;save('produtos',id,{...o,...base});closeM();return}
  const q=+$('pr-q').value;if(!(q>0)){alert('Informe quantas unidades comprou.');return}const v=+$('pr-v').value||0;
  save('produtos',rid('prd'),{...base,desde:TODAY(),ajuste:0,entradas:[{id:rid('ent'),data:TODAY(),un:q,custo:v}]});
  if(v>0&&$('pr-d').checked)save('despesas',rid('dsp'),{nome:'Compra: '+n,valor:v,data:TODAY(),pago:true});closeM()}
function compraProd(id){const p=get(id);
  $('sheet').innerHTML=`<h2 style="font-size:28px">Registrar compra</h2><div style="color:var(--mut)">${esc(p.nome)}</div>
  <div class="g2"><div><label>Unidades compradas *</label><input id="cp-q" type="number" step="0.1" inputmode="decimal" value="1"></div><div><label>Valor pago (R$)</label><input id="cp-v" type="number" step="0.01" inputmode="decimal" placeholder="opcional"></div></div>
  <label>Data</label><input id="cp-d" type="date" value="${TODAY()}">
  <label class="row" style="font-size:13.5px;color:var(--txt)"><input type="checkbox" id="cp-x" class="bx" style="width:26px" checked> Lançar como despesa no Caixa</label>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveCompra('${id}')">Salvar</button><button class="btn sec2" onclick="editProd('${id}')">Voltar</button></div>`}
function saveCompra(id){const q=+$('cp-q').value;if(!(q>0)){alert('Informe as unidades.');return}const v=+$('cp-v').value||0,d=$('cp-d').value||TODAY(),p=get(id);delete p.id;
  p.entradas=[...(p.entradas||[]),{id:rid('ent'),data:d,un:q,custo:v}];save('produtos',id,p);
  if(v>0&&$('cp-x').checked)save('despesas',rid('dsp'),{nome:'Compra: '+p.nome,valor:v,data:d,pago:true});closeM()}
function ajustarProd(id){const p=get(id),e=estProd(p);
  $('sheet').innerHTML=`<h2 style="font-size:28px">Acertar contagem</h2><div style="color:var(--mut)">${esc(p.nome)}</div>
  <div class="card" style="font-size:13px">O app calcula <b>${n1(e.rest)} sessões</b>. Se na prateleira tem outro valor (perdas, uso fora do app), digite o real:</div>
  <label>Sessões restantes de verdade</label><input id="aj-r" type="number" step="0.1" inputmode="decimal" value="${n1(e.rest).replace(',','.')}">
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveAjuste('${id}',${e.rest})">Salvar</button><button class="btn sec2" onclick="editProd('${id}')">Voltar</button></div>`}
function saveAjuste(id,atual){const r=+$('aj-r').value;if($('aj-r').value===''||isNaN(r))return;const p=get(id);delete p.id;p.ajuste=(+p.ajuste||0)+(r-atual);save('produtos',id,p);closeM()}

function vCatalogo(){

  return `<div class="sec" style="margin-top:0"><h2>Catálogo</h2><button class="btn sm" onclick="editSv()">+ Serviço</button></div>

  ${CATS.map(([k,l])=>{const g=sv.filter(s=>(s.cat||'outros')===k);return g.length?`<h3 style="font-size:23px;margin:14px 2px 6px">${l}</h3><div class="card">${g.map(s=>`<div class="li" onclick="editSv('${s.id}')"><div class="sp"><b>${esc(s.nome)}</b><div class="cat-d">${esc(s.desc||'')}</div></div><b style="color:var(--rose2)">${s.preco?BRL(s.preco):'—'}</b></div>`).join('')}</div>`:''}).join('')}
  <div class="sec"><h2>Pacotes de Bem-Estar</h2><button class="btn sec2 sm" onclick="editPacTab()">Editar</button></div>
  <div class="card" style="padding:10px 6px"><table class="pt"><tr><th></th>${ns.map(n=>`<th>${n} SESSÕES<br>${pd[n]}% OFF</th>`).join('')}</tr>
  ${pt.map(r=>`<tr><td><b>${esc(r.nome)}</b><small>avulso ${BRL(r.preco)}</small></td>${ns.map(n=>`<td class="${n===10?'hl':''}"><b style="color:var(--rose2)">${BRL(pacPreco(r.preco,n))}</b><small>R$ ${(pacPreco(r.preco,n)/n).toLocaleString('pt-BR',{maximumFractionDigits:2})} cada</small></td>`).join('')}</tr>`).join('')}</table></div>
  <div class="acts"><button class="btn wa" onclick="enviarCat()">💬 Enviar tabela por WhatsApp</button></div>`;
}
function enviarCat(){const sv=list('servicos').sort((a,b)=>a.nome.localeCompare(b.nome));
  let m='*Larissa Tiemi Clinic* 💗\nEstética · Massoterapia\n';
  CATS.forEach(([k,l])=>{const g=sv.filter(s=>(s.cat||'outros')===k&&s.preco);if(g.length)m+='\n*'+l+'*\n'+g.map(s=>'• '+s.nome+' — '+BRL(s.preco)).join('\n')+'\n'});
  m+='\n*Pacotes* (4 sessões '+pacDesc()[4]+'% off · 8 sessões '+pacDesc()[8]+'% off · 10 sessões '+pacDesc()[10]+'% off)\n'+pacTab().map(r=>'• '+r.nome+': '+[4,8,10].map(n=>n+'x '+BRL(pacPreco(r.preco,n))).join(' | ')).join('\n')+'\n\n@larissatiemi_clinic';
  window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank')}
function editPacTab(){const pt=pacTab(),pd=pacDesc();
  $('sheet').innerHTML=`<h2 style="font-size:28px">Tabela de pacotes</h2><div class="g2"><div><label>Desconto 4 sessões (%)</label><input id="d4" type="number" value="${pd[4]}"></div><div><label>Desconto 8 sessões (%)</label><input id="d8" type="number" value="${pd[8]}"></div><div><label>Desconto 10 sessões (%)</label><input id="d10" type="number" value="${pd[10]}"></div></div>
  ${pt.map((r,i)=>`<div class="g2"><div><label>Pacote ${i+1}</label><input id="pn${i}" value="${esc(r.nome)}"></div><div><label>Valor avulso (R$)</label><input id="pp${i}" type="number" step="0.01" value="${r.preco}"></div></div>`).join('')}
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="savePacTab(${pt.length})">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button></div>`;$('modal').classList.add('open')}
function savePacTab(n){const c=get(CFG_ID)||{};delete c.id;const pt=[];for(let i=0;i<n;i++){const nm=$('pn'+i).value.trim();if(nm)pt.push({nome:nm,preco:+$('pp'+i).value||0})}
  save('config',CFG_ID,{...c,pacTab:pt,pacDesc:{4:+$('d4').value||0,8:+$('d8').value||0,10:+$('d10').value||0}});closeM()}

/* ===== CAIXA ===== */
function vCaixa(){
  const at=list('atend').filter(a=>a.status!=='cancelado'&&a.status!=='faltou');
  const pacs=list('pacotes'),recP=pacs.filter(p=>p.pago&&(p.pagoEm||p.data).startsWith(MONTH)),pvM=pacs.filter(p=>p.data.startsWith(MONTH)).sort((a,b)=>b.data.localeCompare(a.data));
  const c=cfg(),recM=at.filter(a=>recebidoDe(a)>0&&recMonth(a).startsWith(MONTH)),rec=recM.reduce((s,a)=>s+recebidoDe(a),0)+recP.reduce((s,p)=>s+(+p.valor||0),0);
  const prev=at.filter(a=>a.data.startsWith(MONTH)).reduce((s,a)=>s+pendenteDe(a),0)+pacs.filter(p=>!p.pago&&p.data.startsWith(MONTH)).reduce((s,p)=>s+(+p.valor||0),0);
  const trP=at.filter(a=>a.forma===TROCA&&a.data.startsWith(MONTH)).reduce((s,a)=>s+(+a.valor||0),0),trR=list('trocas').filter(x=>x.data.startsWith(MONTH)).reduce((s,x)=>s+(+x.valor||0),0);
  const parceiras=list('clientes').map(cl=>({cl,s:saldoTroca(cl.id)})).filter(x=>x.s.pr||x.s.rc);
  const dp=list('despesas').filter(d=>d.data.startsWith(MONTH)).sort((a,b)=>b.data.localeCompare(a.data));
  const desp=dp.filter(d=>d.pago).reduce((s,d)=>s+(+d.valor||0),0),dpend=dp.filter(d=>!d.pago).reduce((s,d)=>s+(+d.valor||0),0);
  const por={},fm={};recM.forEach(a=>{const v=recebidoDe(a);fm[a.forma||'Outro']=(fm[a.forma||'Outro']||0)+v;const its=itensDe(a).filter(i=>!i.pacoteId),tot=its.reduce((s,i)=>s+(+i.valor||0),0);if(!its.length||!tot){por[a.servico||'Outros']=(por[a.servico||'Outros']||0)+v;return}its.forEach(i=>{por[i.nome||'Outros']=(por[i.nome||'Outros']||0)+v*(+i.valor||0)/tot})});recP.forEach(p=>{por['Pacotes']=(por['Pacotes']||0)+(+p.valor||0);fm[p.forma||'Outro']=(fm[p.forma||'Outro']||0)+(+p.valor||0)});
  const mx=Math.max(1,...Object.values(por)),taxas=(fm[DEB]||0)*(+c.taxaDeb||0)/100+(fm[CRED]||0)*(+c.taxaCred||0)/100;
  return `<div class="row" style="margin-bottom:12px"><button class="btn sec2 sm" onclick="MONTH=addM(-1);render()">‹</button><input type="month" value="${MONTH}" onchange="MONTH=this.value||TODAY().slice(0,7);render()" style="flex:1"><button class="btn sec2 sm" onclick="MONTH=addM(1);render()">›</button></div>
  <div class="tiles"><div class="tile"><small>Recebido</small><b style="color:var(--ok)">${BRL(rec)}</b></div><div class="tile"><small>A receber</small><b style="color:var(--warn)">${BRL(prev)}</b></div><div class="tile"><small>Despesas pagas</small><b style="color:var(--bad)">${BRL(desp)}</b></div><div class="tile"><small>Lucro do mês</small><b>${BRL(rec-taxas-desp)}</b></div></div>
  <div class="card"><h3>Por serviço</h3>${Object.entries(por).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-top:8px;font-size:13px"><div class="row"><span class="sp">${esc(k)}</span><b>${BRL(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<div class="empty">Sem recebimentos neste mês.</div>'}
  ${Object.keys(fm).length?`<div style="margin-top:12px;font-size:12.5px;color:var(--mut)">`+Object.entries(fm).map(([k,v])=>`${k}: <b>${BRL(v)}</b>`).join(' · ')+`</div>`:''}${taxas>0?`<div style="margin-top:8px;font-size:12.5px;color:var(--mut)">Taxas de cartão (estimadas): <b>${BRL(taxas)}</b> — já descontadas do lucro.</div>`:''}</div>
  ${parceiras.length||trP||trR?`<div class="sec"><h2>Trocas de serviços 🤝</h2></div><div class="card"><div class="g2" style="font-size:13px"><div>Prestei no mês<br><b>${BRL(trP)}</b></div><div>Recebi no mês<br><b>${BRL(trR)}</b></div></div>${parceiras.map(({cl,s})=>`<div class="li" onclick="editCli('${cl.id}')"><b class="sp">${esc(cl.nome)}</b><span style="font-size:12.5px;color:${s.saldo>0?'var(--ok)':s.saldo<0?'var(--bad)':'var(--mut)'}">${s.saldo>0?'te deve '+BRL(s.saldo):s.saldo<0?'você deve '+BRL(-s.saldo):'em dia'}</span></div>`).join('')}</div>`:''}
  ${pvM.length?`<div class="sec"><h2>Pacotes vendidos</h2></div><div class="card">${pvM.map(p=>`<div class="li ${p.pago?'ap done':''}"><input type="checkbox" class="bx" ${p.pago?'checked':''} onchange="togPac('${p.id}')"><div class="sp"><div class="i"><b>${esc((get(p.clienteId)||{}).nome||'')}</b></div><small style="color:var(--mut)">${esc(p.nome)}</small></div><b>${BRL(p.valor)}</b></div>`).join('')}</div>`:''}
  <div class="sec"><h2>Despesas</h2><button class="btn sm" onclick="editDesp()">+ Despesa</button></div>
  <div class="card">${dp.map(d=>`<div class="li ${d.pago?'ap done':''}"><input type="checkbox" class="bx" ${d.pago?'checked':''} onchange="togDesp('${d.id}')"><div class="sp" onclick="editDesp('${d.id}')"><div class="i"><b>${esc(d.nome)}</b></div><small style="color:var(--mut)">${fmtD(d.data)}</small></div><b>${BRL(d.valor)}</b></div>`).join('')||'<div class="empty">Nenhuma despesa neste mês.</div>'}
  ${dpend?`<div style="margin-top:8px;font-size:12.5px;color:var(--mut)">A pagar: <b>${BRL(dpend)}</b></div>`:''}</div>`;
}
function addM(n){const d=new Date(MONTH+'-15T12:00:00');d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)}
function togDesp(id){const d=get(id);delete d.id;d.pago=!d.pago;save('despesas',id,d)}
function editDesp(id){const d=id?get(id):{nome:'',valor:'',data:TODAY(),pago:false};
  $('sheet').innerHTML=`<h2 style="font-size:28px">Despesa</h2><label>Descrição</label><input id="d-n" value="${esc(d.nome)}" placeholder="Ex.: Óleo de massagem, aluguel da sala…">
  <div class="g2"><div><label>Valor</label><input id="d-v" type="number" step="0.01" inputmode="decimal" value="${d.valor}"></div><div><label>Data</label><input id="d-d" type="date" value="${d.data}"></div></div>
  <label class="row" style="font-size:14px;color:var(--txt)"><input type="checkbox" id="d-p" class="bx" style="width:26px" ${d.pago?'checked':''}> Já paguei</label>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveDesp('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>${id?`<button class="btn bad" onclick="del('${id}');closeM()">Excluir</button>`:''}</div>`;
  $('modal').classList.add('open')}
function saveDesp(id){const n=$('d-n').value.trim();if(!n){alert('Digite a descrição.');return}save('despesas',id||rid('dsp'),{nome:n,valor:+$('d-v').value||0,data:$('d-d').value||TODAY(),pago:$('d-p').checked});closeM()}

/* ===== AJUSTES ===== */
function vAjustes(){
  const c=cfg(),sv=list('servicos').sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="sec" style="margin-top:0"><h2>Ajustes</h2></div>
  <div class="sec"><h2>Taxas da maquininha</h2></div><div class="card"><div class="g2"><div><label>Débito (%)</label><input id="t-d" type="number" step="0.01" inputmode="decimal" value="${c.taxaDeb||''}"></div><div><label>Crédito (%)</label><input id="t-c" type="number" step="0.01" inputmode="decimal" value="${c.taxaCred||''}"></div></div><div style="font-size:11.5px;color:var(--mut);margin-top:6px">Usadas só para estimar o lucro líquido no Caixa.</div><div class="acts" style="margin-top:10px"><button class="btn sm" onclick="saveTaxas()">Salvar taxas</button></div></div>
  <div class="sec"><h2>Mensagens do WhatsApp</h2></div><div class="card">
  <label>Confirmação</label><textarea id="s-mc" rows="3">${esc(c.msgConf)}</textarea><label>Lembrete (véspera)</label><textarea id="s-ml" rows="3">${esc(c.msgLemb)}</textarea>
  <div style="font-size:11.5px;color:var(--mut);margin-top:6px">Use {nome} {servico} {data} {hora}</div><div class="acts" style="margin-top:10px"><button class="btn sm" onclick="saveMsgs()">Salvar mensagens</button></div></div>
  <div class="sec"><h2>Segurança e backup</h2></div><div class="card"><div class="acts" style="margin:0">
  <button class="btn sec2 sm" onclick="setPin()">🔒 ${localStorage.getItem('lt_pin')?'Trocar / remover':'Criar'} PIN deste aparelho</button><button class="btn sec2 sm" onclick="backup()">⬇️ Baixar backup</button><button class="btn sec2 sm" onclick="pull()">🔄 Sincronizar agora</button></div></div>`;
}
function saveTaxas(){const c=get(CFG_ID)||{};delete c.id;save('config',CFG_ID,{...c,taxaDeb:+$('t-d').value||0,taxaCred:+$('t-c').value||0});alert('Salvo!')}
function saveMsgs(){const c=get(CFG_ID)||{};delete c.id;save('config',CFG_ID,{...c,msgConf:$('s-mc').value,msgLemb:$('s-ml').value});alert('Salvo!')}
function editSv(id){const s=id?get(id):{nome:'',cat:'facial',desc:'',preco:'',dur:60};
  $('sheet').innerHTML=`<h2 style="font-size:28px">Serviço</h2><label>Nome</label><input id="s-n" value="${esc(s.nome)}"><label>Categoria</label><select id="s-c">${CATS.map(([k,l])=>`<option value="${k}" ${(s.cat||'outros')===k?'selected':''}>${l}</option>`).join('')}</select>
  <label>Descrição (opcional)</label><textarea id="s-ds" rows="3">${esc(s.desc||'')}</textarea>
  <div class="g2"><div><label>Valor de tabela (R$)</label><input id="s-p" type="number" step="0.01" inputmode="decimal" value="${s.preco||''}"></div><div><label>Duração padrão (min)</label><input id="s-d" type="number" inputmode="numeric" value="${s.dur}"></div></div>
  ${prodsBox(s)}
  <div style="font-size:11.5px;color:var(--mut);margin-top:6px">O valor de tabela é só uma referência. Na agenda, o valor de cada atendimento é digitado na hora.</div>
  <div class="acts" style="margin-top:16px"><button class="btn" onclick="saveSv('${id||''}')">Salvar</button><button class="btn sec2" onclick="closeM()">Fechar</button>${id?`<button class="btn bad" onclick="if(confirm('Excluir este serviço?')){del('${id}');closeM()}">Excluir</button>`:''}</div>`;$('modal').classList.add('open')}
function saveSv(id){const n=$('s-n').value.trim();if(!n)return;save('servicos',id||rid('svc'),{nome:n,cat:$('s-c').value,desc:$('s-ds').value.trim(),preco:+$('s-p').value||0,dur:+$('s-d').value||60,prods:list('produtos').filter(p=>$('sp-'+p.id)&&$('sp-'+p.id).checked).map(p=>({id:p.id,uso:+$('su-'+p.id).value||1}))});closeM()}
function setPin(){const p=prompt(localStorage.getItem('lt_pin')?'Novo PIN (4 a 8 números). Deixe vazio para remover:':'Crie um PIN (4 a 8 números):');if(p===null)return;
  if(!p){localStorage.removeItem('lt_pin');alert('PIN removido.');render();return}if(!/^\d{4,8}$/.test(p)){alert('Use de 4 a 8 números.');return}localStorage.setItem('lt_pin',p);alert('PIN criado neste aparelho.');render()}
function chkPin(){if($('pin').value===localStorage.getItem('lt_pin')){$('lock').style.display='none';$('pin').value=''}}
function backup(){const b=new Blob([JSON.stringify(C.items,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lt-clinic-backup-'+TODAY()+'.json';a.click()}

/* ===== início ===== */
if(localStorage.getItem('lt_pin'))$('lock').style.display='flex';
render();
setTimeout(()=>{$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),500)},1100);
function migrar(){
  if($('sync').className!=='ok')return;
  const c=get(CFG_ID)||{};if(c.catV>=1)return;
  const ex=['Massagem relaxante','Massagem modeladora','Drenagem linfática','Limpeza de pele','Design de sobrancelha'];
  list('servicos').forEach(s=>{if(!s.cat&&ex.includes(s.nome)){delete C.items[s.id];C.pending[s.id]='del'}});
  CAT_SEED.forEach(([cat,nome,preco,dur,desc],i)=>{const id='svc_cat_'+String(i+1).padStart(2,'0');if(!C.items[id])C.items[id]={tipo:'servicos',dados:{nome,cat,desc,preco,dur}},C.pending[id]='up'});
  delete c.id;C.items[CFG_ID]={tipo:'config',dados:{clinica:'Larissa Tiemi Clinic',...c,catV:1,pacTab:PAC_SEED,pacDesc:DESC_SEED}};C.pending[CFG_ID]='up';
  persist();flush();render()}
(async()=>{await pull();
  migrar();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!document.hidden)pull()},30000);
</script>
</body>
</html>
